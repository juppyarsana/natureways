# Copy to /etc/nginx/sites-available/natureways.id and symlink into sites-enabled.
#
# DNS for this domain is proxied through Cloudflare (orange cloud), so TLS uses a
# Cloudflare Origin Certificate instead of Let's Encrypt/certbot — see DEPLOY.md
# Phase 8. Install the cert/key at the paths below before enabling the 443 blocks.

server {
    listen 80;
    server_name natureways.id www.natureways.id cms.natureways.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name natureways.id www.natureways.id;

    ssl_certificate     /etc/ssl/cloudflare/natureways.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/natureways.id.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name cms.natureways.id;

    ssl_certificate     /etc/ssl/cloudflare/natureways.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/natureways.id.key;

    # Strapi media uploads can be larger than Nginx's 1MB default.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
